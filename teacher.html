<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Teacher | AI Learning</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050509;
    --card: rgba(255,255,255,.06);
    --text: #ffffff;
    --muted: #a9a9b8;
    --border: rgba(255,255,255,.12);
    --accent: #8b5cf6;
    --accent2: #06b6d4;
}

body.light {
    --bg: #f5f7fb;
    --card: rgba(0,0,0,.05);
    --text: #17171c;
    --muted: #5f6270;
    --border: rgba(0,0,0,.12);
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(124,58,237,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(6,182,212,.18),
            transparent 35%
        ),

        var(--bg);

    transition:
        background .4s ease,
        color .4s ease;

    overflow-x: hidden;
}


/* HEADER */

header {
    padding: 14px 18px;

    border-bottom:
        1px solid var(--border);

    background:
        rgba(5,5,9,.65);

    backdrop-filter:
        blur(18px);

    position: sticky;
    top: 0;
    z-index: 100;
}

body.light header {
    background:
        rgba(255,255,255,.75);
}

.navbar {

    max-width: 1100px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    color: var(--text);

    text-decoration: none;

    font-weight: bold;

    white-space: nowrap;
}

.brand img {

    width: 42px;

    height: 42px;

    object-fit: contain;
}


/* NAV BUTTONS */

.nav-actions {

    display: flex;

    align-items: center;

    gap: 8px;
}

.home-btn,
.theme-btn {

    padding: 10px 14px;

    border-radius: 12px;

    border:
        1px solid var(--border);

    color: var(--text);

    background: var(--card);

    text-decoration: none;

    cursor: pointer;

    font-size: 14px;

    transition: .25s ease;
}

.home-btn:hover,
.theme-btn:hover {

    transform: translateY(-2px);

    border-color:
        var(--accent);
}


/* MAIN */

main {

    max-width: 1000px;

    margin: auto;

    padding:
        45px 18px 70px;
}

.hero {

    text-align: center;
}

.badge {

    display: inline-block;

    padding: 8px 15px;

    border:
        1px solid rgba(139,92,246,.35);

    border-radius: 50px;

    color: #c4b5fd;

    background:
        rgba(139,92,246,.08);

    font-size: 13px;

    margin-bottom: 18px;
}

h1 {

    font-size:
        clamp(40px, 8vw, 70px);

    margin-bottom: 15px;
}

.gradient {

    background:
        linear-gradient(
            90deg,
            #a855f7,
            #6366f1,
            #06b6d4
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color: transparent;
}

.intro {

    max-width: 650px;

    margin: auto;

    color: var(--muted);

    line-height: 1.8;
}


/* TEACHER */

.teacher-area {

    margin:
        35px auto 0;

    max-width: 700px;

    text-align: center;
}

.robot-container {

    position: relative;

    width: 320px;

    height: 320px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;
}

.robot-container::before {

    content: "";

    position: absolute;

    width: 240px;

    height: 240px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

    filter:
        blur(70px);

    opacity: .25;
}


/* AI TEACHER IMAGE */

.robot {

    position: relative;

    width: 290px;

    max-width: 90vw;

    object-fit: contain;

    filter:
        drop-shadow(
            0 25px 40px rgba(0,0,0,.55)
        );

    animation:
        floatRobot 2.5s ease-in-out infinite;
}


/* FASTER FLOAT */

@keyframes floatRobot {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-12px);
    }
}


/* TALKING EFFECT */

.robot.talking {

    animation:
        floatRobot 2.5s ease-in-out infinite,
        talkingGlow .7s ease-in-out infinite;
}

@keyframes talkingGlow {

    0%,
    100% {

        filter:
            drop-shadow(
                0 25px 40px rgba(0,0,0,.55)
            );
    }

    50% {

        filter:
            drop-shadow(
                0 0 32px
                rgba(139,92,246,.9)
            );
    }
}


/* RESPONSE */

.status {

    min-height: 25px;

    margin:
        10px 0;

    color:
        var(--muted);

    font-size: 14px;
}

.response-box {

    min-height: 100px;

    margin:
        18px auto;

    padding: 20px;

    max-width: 650px;

    border-radius: 20px;

    border:
        1px solid var(--border);

    background:
        var(--card);

    color: var(--text);

    line-height: 1.7;

    text-align: left;

    white-space: pre-wrap;
}


/* TALK BUTTON */

.talk-button {

    width: 100%;

    max-width: 360px;

    padding: 17px 25px;

    margin-top: 10px;

    border: none;

    border-radius: 16px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

    box-shadow:
        0 15px 35px
        rgba(124,58,237,.25);

    transition: .3s ease;
}

.talk-button:hover {

    transform:
        translateY(-3px);
}

.talk-button:active {

    transform:
        scale(.98);
}


/* MIC */

.mic-button {

    width: 62px;

    height: 62px;

    margin-top: 18px;

    border-radius: 50%;

    border:
        1px solid var(--border);

    color: var(--text);

    background:
        var(--card);

    font-size: 22px;

    cursor: pointer;

    transition: .3s ease;
}

.mic-button:hover {

    border-color:
        var(--accent);

    transform:
        scale(1.05);
}

.mic-button.listening {

    background:
        #7c3aed;

    box-shadow:

        0 0 0 10px
        rgba(124,58,237,.12),

        0 0 35px
        rgba(124,58,237,.6);
}

/* MOUTH / LIP SYNC EFFECT */

.robot-container {
    position: relative;
}

.mouth-overlay {
    position: absolute;

    /* We will adjust these two values if needed */
    left: 50%;
    top: 57%;

    width: 32px;
    height: 10px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #1b1025;

    opacity: 0;

    transition:
        opacity .15s ease,
        height .15s ease,
        width .15s ease;

    z-index: 5;
}


/* Mouth moves while AI is speaking */

.mouth-overlay.talking {
    opacity: 1;

    animation:
        lipSync .16s ease-in-out infinite alternate;
}


@keyframes lipSync {

    from {
        width: 24px;
        height: 6px;
        border-radius: 50%;
    }

    to {
        width: 34px;
        height: 18px;
        border-radius: 40%;
    }

}


/* FOOTER */

footer {

    padding: 25px;

    text-align: center;

    border-top:
        1px solid var(--border);

    color:
        var(--muted);

    font-size: 13px;
}


/* MOBILE */

@media(max-width:600px) {

    header {

        padding:
            11px 12px;
    }

    .brand span {

        display: none;
    }

    .home-btn,
    .theme-btn {

        padding:
            9px 11px;

        font-size:
            13px;
    }

    main {

        padding:
            40px 15px 55px;
    }

    .robot-container {

        width: 280px;

        height: 280px;
    }

    .robot {

        width: 250px;
    }

    .intro {

        font-size:
            14px;
    }
}

</style>
</head>


<body>


<header>

<nav class="navbar">


<a
href="index.html"
class="brand">

<img
src="IMG_20260623_215331%20(2).png"
alt="AI Learning Logo">

<span>
AI Learning
</span>

</a>


<div class="nav-actions">


<a
href="index.html"
class="home-btn">

Home

</a>


<button
id="themeButton"
class="theme-btn">

🌙

</button>


</div>

</nav>

</header>



<main>


<section class="hero">


<div class="badge">

Personal AI Learning Companion

</div>


<h1>

Meet Your

<span class="gradient">

AI Teacher

</span>

</h1>


<p class="intro">

Ask questions, explore ideas, and learn with your
personal AI Teacher.

</p>



<div class="teacher-area">


<div class="robot-container">


<img

id="teacherRobot"

class="robot"

src="IMG_20260703_070442%20(4)%20(1).png"

alt="AI Teacher">

</div>



<div
id="status"
class="status">

Ready to learn with you.

</div>



<div
id="responseBox"
class="response-box">

Your AI Teacher's response will appear here.

</div>



<button
id="talkButton"
class="talk-button">

Talk to AI Teacher

</button>


<br>


<button
id="micButton"
class="mic-button"
title="Start speaking">

MIC

</button>


<div
id="mouthSystem"
class="mouth-system">

</div>


</div>

</section>

</main>



<footer>

AI Learning — Intelligent Learning for a Better Future

</footer>



<script>


/* ELEMENTS */

const talkButton =
    document.getElementById(
        "talkButton"
    );

const micButton =
    document.getElementById(
        "micButton"
    );

const status =
    document.getElementById(
        "status"
    );

const responseBox =
    document.getElementById(
        "responseBox"
    );

const teacherRobot =
    document.getElementById(
        "teacherRobot"
    );

const mouthOverlay =
    document.getElementById(
        "mouthOverlay"
    );

const themeButton =
    document.getElementById(
        "themeButton"
    );


/* CLOUDFLARE BACKEND */

const BACKEND_URL =
    "https://ai-learning-backend.aibuilder171.workers.dev/";


/* DARK / LIGHT MODE */

themeButton.addEventListener(
    "click",
    function() {

        document.body.classList.toggle(
            "light"
        );

        if (
            document.body.classList.contains(
                "light"
            )
        ) {

            themeButton.textContent =
                "☀️";

        } else {

            themeButton.textContent =
                "🌙";

        }

    }
);


/* SPEECH */

let recognition;

let isListening =
    false;


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.lang =
        "en-US";


    recognition.onstart =
        function() {

            isListening =
                true;

            micButton.classList.add(
                "listening"
            );

            status.textContent =
                "I'm listening. Ask your question.";

            responseBox.textContent =
                "Listening...";

        };


    recognition.onresult =
        async function(event) {

            const question =
                event.results[0][0]
                .transcript;

            status.textContent =
                "AI Teacher is thinking...";

            responseBox.textContent =
                "Please wait...";


            await askAI(
                question
            );

        };


    recognition.onerror =
        function(event) {

            status.textContent =
                "I couldn't hear you clearly.";

            responseBox.textContent =
                "Please try again.";

            console.log(
                event.error
            );

        };


    recognition.onend =
        function() {

            isListening =
                false;

            micButton.classList.remove(
                "listening"
            );

        };

}


/* ASK AI */

async function askAI(
    question
) {

    try {

        const response =
            await fetch(
                BACKEND_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            question:
                                question

                        })

                }
            );


        const data =
            await response.json();


        if (
            data.success &&
            data.answer
        ) {

            responseBox.textContent =
                data.answer;

            status.textContent =
                "AI Teacher is speaking...";

            speakAnswer(
                data.answer
            );

        } else {

            responseBox.textContent =
                "Sorry, I couldn't get an answer right now.";

            status.textContent =
                "The AI Teacher could not respond.";

            console.log(
                data
            );

        }

    } catch (error) {

        responseBox.textContent =
            "Sorry, I couldn't connect to the AI Teacher.";

        status.textContent =
            "Connection error.";

        console.error(
            error
        );

    }

}


/* AI VOICE */

function speakAnswer(
    text
) {

    if (
        !("speechSynthesis" in window)
    ) {

        status.textContent =
            "AI Teacher answered.";

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "en-US";

    speech.rate =
        1;

    speech.pitch =
        1;


    speech.onstart =
    function() {

        teacherRobot.classList.add(
            "talking"
        );

        mouthOverlay.classList.add(
            "talking"
        );

    };


     speech.onend =
    function() {

        teacherRobot.classList.remove(
            "talking"
        );

        mouthOverlay.classList.remove(
            "talking"
        );

        status.textContent =
            "Ready to learn with you.";

    };


/* MICROPHONE */

micButton.addEventListener(
    "click",
    function() {

        if (!recognition) {

            status.textContent =
                "Voice input is not supported.";

            return;

        }


        if (isListening) {

            recognition.stop();

            return;

        }


        recognition.start();

    }
);


/* TALK BUTTON */

talkButton.addEventListener(
    "click",
    function() {

        const question =
            prompt(
                "What would you like to ask your AI Teacher?"
            );


        if (!question) {

            return;

        }


        status.textContent =
            "AI Teacher is thinking...";

        responseBox.textContent =
            "Please wait...";


        askAI(
            question
        );

    }
);


</script>

</body>
</html>
